[package]
name = "evidence-pipeline"
version = "1.0.0"
edition = "2021"
authors = ["Protocol Digital Twin Systems Architecture Team"]
description = "Canonical evidence normalization, validation, and transport pipeline for C++ engine output"

[lib]
name = "evidence_pipeline"
path = "src/lib.rs"

[[bin]]
name = "evidence_pipeline"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.5", features = ["derive"] }
chrono = { version = "0.4", features = ["serde"] }
regex = "1.10"
uuid = { version = "1.10", features = ["v4", "serde"] }
sha2 = "0.10"

[dev-dependencies]
tempfile = "3.10"
