name: CI Quality Gates

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  engine-cpp:
    name: C++20 Systems Engine (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Configure CMake
        run: cmake -B build/engine -S engine/protocol -DCMAKE_BUILD_TYPE=Release

      - name: Build Engine
        run: cmake --build build/engine --config Release

      - name: Run C++ Unit Tests
        run: ctest --test-dir build/engine -C Release --output-on-failure

  pipeline-rust:
    name: Rust Evidence Pipeline (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/evidence_pipeline

      - name: Rust Format Check
        run: cargo fmt --manifest-path packages/evidence_pipeline/Cargo.toml --check

      - name: Run Cargo Clippy
        run: cargo clippy --manifest-path packages/evidence_pipeline/Cargo.toml -- -D warnings

      - name: Run Cargo Tests
        run: cargo test --manifest-path packages/evidence_pipeline/Cargo.toml --verbose

      - name: Build Release Binary
        run: cargo build --manifest-path packages/evidence_pipeline/Cargo.toml --release

  backend-python:
    name: Backend API & PostgreSQL Validation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: network_twin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Set up Rust toolchain for Pipeline Integration
        uses: dtolnay/rust-toolchain@stable

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/api/requirements-dev.txt
          pip install -e packages/contracts/python
          pip install -e apps/api

      - name: Build C++ Engine for End-to-End Tests
        run: |
          cmake -B build/engine -S engine/protocol -DCMAKE_BUILD_TYPE=Release
          cmake --build build/engine --config Release

      - name: Build Rust Evidence Pipeline
        run: cargo build --manifest-path packages/evidence_pipeline/Cargo.toml --release

      - name: Run Ruff Linter
        run: ruff check apps/api packages/contracts/python

      - name: Run Ruff Format Check
        run: ruff format --check apps/api packages/contracts/python

      - name: Run Pytest Suite with PostgreSQL Integration
        env:
          NTWIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/network_twin
        run: pytest apps/api/tests tests/integration -v

      - name: Run SQLite to PostgreSQL Migration Tool Verification
        env:
          NTWIN_DATABASE_URL: postgresql://postgres:postgrespassword@localhost:5432/network_twin
        run: python -m network_twin.storage.migration_tool --sqlite-path data/metadata.db --pg-url postgresql://postgres:postgrespassword@localhost:5432/network_twin

  frontend-web:
    name: React Workstation Typecheck & Vitest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install Web Dependencies
        run: |
          cd apps/web
          npm ci

      - name: Strict TypeScript Type Check
        run: |
          cd apps/web
          npm run typecheck

      - name: Run Vitest Suite
        run: |
          cd apps/web
          npm run test

      - name: Production Vite Build
        run: |
          cd apps/web
          npm run build
